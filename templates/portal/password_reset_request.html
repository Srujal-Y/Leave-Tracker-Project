{% extends "base.html" %}
{% block content %}
<div class="centerwrap">
  <section class="card formcard">
    <h1>Forgot password</h1>
    <p class="muted">Enter your company email. We’ll send a 6-digit OTP to reset your password.</p>
    <form method="post" class="form">
      {% csrf_token %}
      <div class="field">
        <label>Email</label>
        {{ form.email }}
      </div>
      <div class="formactions">
        <button class="btn" type="submit">Send OTP</button>
        <a class="btn ghost" href="{% url 'portal:login' %}">Back to login</a>
      </div>
    </form>
  </section>
</div>
{% endblock %}
