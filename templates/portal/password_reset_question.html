{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>Reset password</h1>
  <p class="muted">Answer the question to set a new password.</p>
  <form method="post" class="form">
    {% csrf_token %}
    <div class="field">
      <label>Email</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label>What is 2+2?</label>
      {{ form.answer }}
    </div>
    <div class="field">
      <label>New password</label>
      {{ form.new_password }}
    </div>
    <div class="field">
      <label>Confirm new password</label>
      {{ form.confirm_password }}
    </div>
    <button class="btn" type="submit">Update password</button>
    <a class="btn ghost" href="{% url 'portal:login' %}">Back to login</a>
  </form>
</section>
{% endblock %}
